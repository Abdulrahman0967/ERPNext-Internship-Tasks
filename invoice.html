<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="invoice.css">
  <title>فاتورة مبيعات</title>
</head>
<body>

  <h1>فاتورة مبيعات</h1>
  <p><strong>رقم الفاتورة:</strong> #001</p>
  <p><strong>التاريخ:</strong> 15-09-2026</p>
  <hr>
  <p><strong>اسم العميل:</strong> شركة رماز</p>

  <!-- Items Table -->
  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>الكمية</th>
        <th>السعر</th>
        <th>الإجمالي</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>تصميم وتطوير واجهة</td>
        <td>1</td>
        <td>100$</td>
        <td>100$</td>
      </tr>
      <tr>
        <td>استضافة سنوية</td>
        <td>1</td>
        <td>50$</td>
        <td>50$</td>
      </tr>
    </tbody>

    <!-- Totals Row -->
    <tfoot>
      <tr>
        <th colspan="3" align="center">المجموع الكلي:</th>
        <th id="grand-total">0$</th>
      </tr>
    </tfoot>
  </table>

  <br>
  <!-- زر تحديث المجموع -->
  <button onclick="calculateTotal()">تحديث المجموع</button>

  <!-- مكان عرض الـ API -->
  <p>بيانات من الخادم: <strong id="api-result">...</strong></p>

  <!-- ربط ملف الجافاسكربت -->
  <script src="invoice.js"></script>

</body>
</html>
